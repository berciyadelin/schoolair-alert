<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SchoolAir Alert</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; background: #f6f7f9; color: #1a1a1a; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    #updated { color: #666; font-size: 0.85rem; margin-bottom: 16px; }
    .school { display: flex; justify-content: space-between; align-items: center; background: #fff; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .name { font-weight: 600; }
    .city { color: #666; font-size: 0.85rem; }
    .badge { min-width: 84px; text-align: center; padding: 6px 10px; border-radius: 999px; color: #fff; font-weight: 600; font-size: 0.9rem; }
    .green { background: #2e9e4f; }
    .yellow { background: #d9a400; }
    .red { background: #d93025; }
    .unknown { background: #888; }
    #error { color: #d93025; }
  </style>
</head>
<body>
  <h1>SchoolAir Alert</h1>
  <div id="updated">Loading...</div>
  <div id="error"></div>
  <div id="list"></div>

  <script>
    // Replace with your API Gateway URL after deploying
    const API_URL = "https://YOUR_API_ID.execute-api.YOUR_REGION.amazonaws.com/schools";
    const REFRESH_MS = 60000; // refresh every 60 seconds

    async function load() {
      const list = document.getElementById("list");
      const err = document.getElementById("error");
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("API returned " + res.status);
        const data = await res.json();
        err.textContent = "";
        list.innerHTML = "";

        data.schools.forEach(s => {
          const row = document.createElement("div");
          row.className = "school";

          const info = document.createElement("div");
          const name = document.createElement("div");
          name.className = "name";
          name.textContent = s.name;
          const city = document.createElement("div");
          city.className = "city";
          city.textContent = s.city;
          info.append(name, city);

          const badge = document.createElement("div");
          badge.className = "badge " + s.status;
          badge.textContent = s.aqi === null ? "No data" : "AQI " + s.aqi;

          row.append(info, badge);
          list.appendChild(row);
        });

        document.getElementById("updated").textContent =
          "Last refreshed: " + new Date().toLocaleTimeString();
      } catch (e) {
        err.textContent = "Could not load data: " + e.message;
      }
    }

    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
